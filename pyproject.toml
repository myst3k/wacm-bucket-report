[project]
name = "wacm-bucket-report"
version = "1.0.0"
description = "Roll up every bucket under a Wasabi WACM control account to CSV: storage, 90-day growth, and per-bucket features."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.scripts]
wacm-bucket-report = "wacm_bucket_report.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
